name: medcv-gpu
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=2.2
  - matplotlib
  - scikit-image
  - scikit-learn
  - scipy
  - pillow
  - tqdm
  - simpleitk
  - nibabel
  - jupyterlab
  - ipykernel
  - pip:
      - torch==2.7.0
      - torchvision==0.22.0
      - albumentations==2.0.8
      - opencv-python==4.11.0.86
      - ipywidgets
      - imageio
      - pyyaml
      - onnx
      - onnxruntime
      - onnxscript
      - jupyter

