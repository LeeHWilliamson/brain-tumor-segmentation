name: medcv-gpu
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - cudatoolkit=11.8  # Comment this out if installing CUDA via pip
  - matplotlib
  - numpy
  - scikit-image
  - scikit-learn
  - nibabel
  - simpleitk
  - jupyterlab
  - tqdm
  - albumentations
  - pillow
  - pip:
      - opencv-python-headless
      - ipywidgets
