name: medcv-gpu
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=2.2
  - torch=2.7.0  # Matches your dev build
  - torchvision=0.22.0
  - torchaudio  # version not pinned, adjust if needed
  - cudatoolkit=12.1
  - matplotlib
  - scikit-image
  - scikit-learn
  - scipy
  - pillow
  - tqdm
  - simpleitk
  - nibabel
  - jupyterlab
  - ipykernel
  - pip:
      - albumentations==2.0.8
      - opencv-python==4.11.0.86
      - ipywidgets
      - imageio
      - pyyaml
